<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Diagnóstico del equipo</title>
<style>
  /* Colores */
  :root {
    color-scheme: light dark;
    --fondo: #f6f7f9;
    --superficie: #ffffff;
    --texto: #1b1f24;
    --texto-suave: #545d68;
    --borde: #d5d9df;
    --enlace: #0b5cad;
    --verde: #146c2e;
    --verde-fondo: #dcf3e2;
    --amarillo: #7a4d00;
    --amarillo-fondo: #fdefc8;
    --rojo: #a4161a;
    --rojo-fondo: #fbdcdc;
    --gris: #4a5260;
    --gris-fondo: #e6e8ec;
    accent-color: var(--enlace);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #121417;
      --superficie: #1c1f24;
      --texto: #e8eaed;
      --texto-suave: #a9b0b9;
      --borde: #343a42;
      --enlace: #79b8ff;
      --verde: #8be0a4;
      --verde-fondo: #173823;
      --amarillo: #ffd479;
      --amarillo-fondo: #3d300f;
      --rojo: #ff9a9a;
      --rojo-fondo: #45181a;
      --gris: #c3c9d1;
      --gris-fondo: #2c3138;
    }
  }

  /* Base */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font: 16px/1.5 system-ui, "Segoe UI", sans-serif;
  }

  .contenedor {
    min-width: 320px;
    max-width: 1200px;
    margin: 0 auto;
    padding: clamp(16px, 4vw, 32px);
  }

  h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin: 0 0 4px; }
  h2 { font-size: 1.25rem; margin: 0 0 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h3 { font-size: 1rem; margin: 20px 0 8px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .subtitulo { color: var(--texto-suave); margin: 0 0 24px; }

  a { color: var(--enlace); }
  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid var(--enlace);
    outline-offset: 2px;
  }

  /* Apartados */
  section {
    background: var(--superficie);
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: clamp(16px, 3vw, 24px);
    margin-bottom: 16px;
  }

  .resumen ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .resumen li { display: flex; align-items: center; gap: 10px; }
  .aviso { background: var(--amarillo-fondo); color: var(--amarillo); padding: 10px 12px; border-radius: 6px; }
  .motivos { margin: 0 0 12px; padding-left: 20px; color: var(--texto-suave); }

  /* Semáforo */
  .indicador {
    display: inline-block;
    min-width: 84px;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    text-align: center;
  }
  .indicador.verde { background: var(--verde-fondo); color: var(--verde); }
  .indicador.amarillo { background: var(--amarillo-fondo); color: var(--amarillo); }
  .indicador.rojo { background: var(--rojo-fondo); color: var(--rojo); }
  .indicador.gris { background: var(--gris-fondo); color: var(--gris); }

  /* Puntuación */
  .puntuacion { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; font-size: 1.25rem; }
  .puntuacion strong { font-size: clamp(2.5rem, 8vw, 3.5rem); line-height: 1; }
  .puntuacion.verde strong { color: var(--verde); }
  .puntuacion.amarillo strong { color: var(--amarillo); }
  .puntuacion.rojo strong { color: var(--rojo); }

  /* Listas largas y desplegables */
  .lista-larga { margin: 0 0 12px; padding-left: 20px; overflow-wrap: anywhere; }
  details { margin: 12px 0; }
  summary { cursor: pointer; font-weight: 600; color: var(--enlace); padding: 6px 0; }
  summary:focus-visible { outline: 3px solid var(--enlace); outline-offset: 2px; }
  details .lista-larga { max-height: 360px; overflow-y: auto; margin-top: 8px; }

  /* Tablas */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--borde); vertical-align: top; overflow-wrap: anywhere; }
  th { width: 40%; font-weight: 600; color: var(--texto-suave); }

  /* Revisión manual */
  .revision { display: grid; gap: 12px; grid-template-columns: 1fr; }
  fieldset { border: 1px solid var(--borde); border-radius: 8px; margin: 0; padding: 12px; }
  legend { font-weight: 600; padding: 0 6px; }
  fieldset label { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; cursor: pointer; }
  fieldset input { width: 18px; height: 18px; margin-top: 3px; flex-shrink: 0; }

  .colores { display: flex; flex-wrap: wrap; gap: 8px; }
  .colores button {
    font: inherit;
    padding: 8px 16px;
    min-height: 44px;
    border: 1px solid var(--borde);
    border-radius: 6px;
    background: var(--superficie);
    color: var(--texto);
    cursor: pointer;
  }
  .colores button:hover { background: var(--gris-fondo); }
  .colores button:active { transform: translateY(1px); }

  #capa-color {
    position: fixed;
    inset: 0;
    z-index: 10;
    cursor: pointer;
  }

  @media (min-width: 768px) {
    .revision { grid-template-columns: 1fr 1fr; }
    th { width: 32%; }
  }

  @media (min-width: 1200px) {
    .revision { grid-template-columns: 1fr 1fr 1fr; }
  }

  /* Impresión */
  @media print {
    body { background: #fff; color: #000; }
    section { break-inside: avoid; border-color: #999; }
    .colores, #capa-color { display: none; }
  }
</style>
</head>
<body>
<main class="contenedor">
  <h1>Diagnóstico del equipo</h1>
  <p class="subtitulo">Equipo {{EQUIPO}} · Informe del {{FECHA}}</p>
  {{CONTENIDO}}
</main>
<div id="capa-color" hidden></div>
<script>
  // Prueba de pantalla a color completo
  const capa = document.getElementById('capa-color');

  function cerrarCapa() {
    capa.hidden = true;
    if (document.fullscreenElement) document.exitFullscreen();
  }

  document.querySelectorAll('[data-color]').forEach((boton) => {
    boton.addEventListener('click', () => {
      capa.style.background = boton.dataset.color;
      capa.hidden = false;
      if (capa.requestFullscreen) capa.requestFullscreen().catch(() => {});
    });
  });

  capa.addEventListener('click', cerrarCapa);
  document.addEventListener('keydown', (evento) => {
    if (evento.key === 'Escape') cerrarCapa();
  });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) capa.hidden = true;
  });
</script>
</body>
</html>
